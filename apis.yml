aid: misfits-market
name: Misfits Market
description: 'Misfits Market is a subscription-based online grocery delivery service founded in 2018 by
  Abhi Ramesh and headquartered in Philadelphia. It rescues surplus, cosmetically imperfect, and
  near-best-by organic produce, pantry staples, dairy, and meat, then delivers them to customers at a
  discount to reduce food waste. Members shop a personalized storefront during a weekly delivery window
  with no subscription fees or order minimums, and can skip or cancel anytime. The company acquired rival
  Imperfect Foods in 2022 and The Rounds in 2025. Backed by Accel and SoftBank Vision Fund. Misfits
  Market operates as a consumer e-commerce business and publishes no public developer API surface.'
